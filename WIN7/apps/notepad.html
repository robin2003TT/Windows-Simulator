<div class="window app-window" id="notepad-app" data-app="notepad">
  <div class="title-bar">
    <span class="title">Notepad</span>
    <div class="window-controls">
      <button class="minimize">🗕</button>
      <button class="maximize">🗖</button>
      <button class="close">✖</button>
    </div>
  </div>
  <div class="window-content">
    <textarea id="notepad-text" style="width:100%;height:100%;resize:none;"></textarea>
  </div>
</div>
