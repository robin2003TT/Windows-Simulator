<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snake Retro DLC</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: black;
      color: #0f0;
      font-family: monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    #menu, #gameScreen, #pauseMenu, #gameOverScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .active {
      display: flex !important;
    }

    button, select {
      background: black;
      color: #0f0;
      border: 1px solid #0f0;
      margin: 5px;
      padding: 5px 10px;
      font-family: monospace;
      cursor: pointer;
    }

    canvas {
      border: 2px solid #0f0;
      background: black;
      touch-action: none;
      display: block;
    }

    #info {
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      width: 320px;
      margin-bottom: 5px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="menu" class="active">
    <h1>Snake Retro DLC</h1>
    <label>Speed:
      <select id="speedSelect">
        <option value="200">Medium</option>
        <option value="150">Hard</option>
        <option value="120">Extreme</option>
        <option value="90">Crazy</option>
        <option value="60">Insane</option>
      </select>
    </label>
    <label>Skin:
      <select id="skinSelect">
        <option value="lime">Green</option>
        <option value="red">Red</option>
        <option value="yellow">Yellow</option>
        <option value="cyan">Cyan</option>
        <option value="magenta">Magenta</option>
        <option value="white">White</option>
        <option value="blue">Blue</option>
        <option value="rgb">RGB</option>
      </select>
    </label>
    <button onclick="startGame()">Play</button>
  </div>

  <div id="gameScreen">
    <div id="info">
      <div>Score: <span id="score">0</span></div>
      <div>⏱️: <span id="goldTimer">-</span></div>
    </div>
    <canvas id="game" width="320" height="320"></canvas>
    <button id="pauseBtn">Pause</button>
  </div>

  <div id="pauseMenu">
    <h2>Paused</h2>
    <button onclick="resumeGame()">Resume</button>
    <button onclick="goToMenu()">Menu</button>
  </div>

  <div id="gameOverScreen">
    <h2>You Lost</h2>
    <div>Your Score: <span id="finalScore">0</span></div>
    <button onclick="retryGame()">Retry</button>
    <button onclick="goToMenu()">Menu</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const goldTimerEl = document.getElementById('goldTimer');
    const finalScoreEl = document.getElementById('finalScore');
    const pauseBtn = document.getElementById('pauseBtn');

    const menu = document.getElementById('menu');
    const gameScreen = document.getElementById('gameScreen');
    const pauseMenu = document.getElementById('pauseMenu');
    const gameOverScreen = document.getElementById('gameOverScreen');

    let snake, direction, nextDirection, food, goldenFood, goldenTimer, score, normalCount;
    let speed = 150, skin = 'lime';
    let intervalId = null, goldInterval = null;

    function setActive(id) {
      [menu, gameScreen, pauseMenu, gameOverScreen].forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function drawPixel(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * 16, y * 16, 15, 15);
    }

    function randomFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * 20),
          y: Math.floor(Math.random() * 20)
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      return pos;
    }

    function update() {
      const head = { x: (snake[0].x + direction.x + 20) % 20, y: (snake[0].y + direction.y + 20) % 20 };
      if (snake.some((s, i) => i > 0 && s.x === head.x && s.y === head.y)) {
        endGame();
        return;
      }
      snake.unshift(head);

      if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
        score += goldenTimer;
        goldenFood = null;
        goldenTimer = 0;
        goldTimerEl.textContent = '-';
      } else if (head.x === food.x && head.y === food.y) {
        score++;
        normalCount++;
        food = randomFood();
        if (normalCount % 5 === 0 && !goldenFood) {
          goldenFood = randomFood();
          goldenTimer = 10;
        }
      } else {
        snake.pop();
      }
      direction = nextDirection;
      draw();
      scoreEl.textContent = score;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPixel(food.x, food.y, 'red');
      if (goldenFood) drawPixel(goldenFood.x, goldenFood.y, 'yellow');
      snake.forEach((seg, i) => {
        if (skin === 'rgb') {
          const colors = ['red', 'green', 'blue'];
          drawPixel(seg.x, seg.y, colors[i % colors.length]);
        } else {
          drawPixel(seg.x, seg.y, skin);
        }
      });
    }

    function updateGoldenTimer() {
      if (goldenFood) {
        goldenTimer--;
        if (goldenTimer <= 0) {
          goldenFood = null;
          goldenTimer = 0;
        }
        goldTimerEl.textContent = goldenFood ? goldenTimer : '-';
      }
    }

    function startGame() {
      speed = +document.getElementById('speedSelect').value;
      skin = document.getElementById('skinSelect').value;
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      snake = [{ x: 10, y: 10 }];
      food = randomFood();
      goldenFood = null;
      goldenTimer = 0;
      score = 0;
      normalCount = 0;
      setActive('gameScreen');
      scoreEl.textContent = '0';
      goldTimerEl.textContent = '-';
      if (intervalId) clearInterval(intervalId);
      if (goldInterval) clearInterval(goldInterval);
      intervalId = setInterval(update, speed);
      goldInterval = setInterval(updateGoldenTimer, 1000);
    }

    function pauseGame() {
      clearInterval(intervalId);
      clearInterval(goldInterval);
      setActive('pauseMenu');
    }

    function resumeGame() {
      setActive('gameScreen');
      intervalId = setInterval(update, speed);
      goldInterval = setInterval(updateGoldenTimer, 1000);
    }

    function goToMenu() {
      clearInterval(intervalId);
      clearInterval(goldInterval);
      setActive('menu');
    }

    function retryGame() {
      startGame();
    }

    function endGame() {
      clearInterval(intervalId);
      clearInterval(goldInterval);
      finalScoreEl.textContent = score;
      setActive('gameOverScreen');
    }

    document.addEventListener('keydown', e => {
      const keyMap = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }
      };
      const newDir = keyMap[e.key];
      if (newDir && (newDir.x !== -direction.x || newDir.y !== -direction.y)) {
        nextDirection = newDir;
      }
    });

    // Touch and mouse swipe control variables
    let startX = 0, startY = 0;
    const swipeThreshold = 30; // minimum px distance to count as swipe

    function handleSwipe(dx, dy) {
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
        else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
      } else {
        if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
      }
    }

    canvas.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > swipeThreshold || Math.abs(dy) > swipeThreshold) {
        handleSwipe(dx, dy);
      }
    });

    canvas.addEventListener('mousedown', e => {
      startX = e.clientX;
      startY = e.clientY;
      e.preventDefault();
    });

    canvas.addEventListener('mouseup', e => {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) > swipeThreshold || Math.abs(dy) > swipeThreshold) {
        handleSwipe(dx, dy);
      }
      e.preventDefault();
    });

    pauseBtn.addEventListener('click', pauseGame);
  </script>
</body>
</html>
